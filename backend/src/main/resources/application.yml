server:
  port: 8080

spring:
  application:
    name: aradhana-school-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/aradhana_school
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: change-this-to-a-long-random-secret-key
    expiration-ms: 86400000
